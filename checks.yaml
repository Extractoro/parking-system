# Settings for the teacher's checker, joint project C09 «Паркінги» (Web + DPC).
# From joint/checks-template.yaml of both kits. The core of each course is always checked;
# `items` lists only the chosen items outside the core that are actually done.
# OpenAPI paths are relative to this file; URLs must be reachable by the checker.
web:
  openapi: web/openapi.yaml
  base: http://localhost:8080
  items: [О1.5, О1.6, О2.3, О2.4, Д2.4, Д2.5, О3.3, О3.4, О4.4, О4.5, Д4.1]
  # lab 4: the long operation POST /v1/bookings/{id}/entries (x-course: long-operation) needs a booking of
  # the CURRENT hour (entry only inside the booked interval), the example `normal` gets 409 outside-interval;
  # the simulator is the kit one with the default route POST /admin/unavailable (simulator_down not set)
  # lab 3: roles of GET /v1/me are the default ones (user, staff); demo logins user1, user2, staff1 (migration 904)
  # services: {app-a: web-app-a, app-b: web-app-b}
dpc:
  openapi: dpc/openapi.yaml
  base: http://localhost:8000
  items: [О1.5, Д1.4, О2.2]
  resource: {path: /v1/garage/center, ok_field: invariant_ok}
  metrics: [queue_length, in_flight, rejected]
  # lab 2: relative tolerance (O2.2: rounding <= 1e-13 at bench_n, method error < 1e-13 for n >= 1e4),
  # n of the speed-up table (T_1 = 3.8 s with blocks of 1e6), modes of the shared sum
  compute: {tolerance: 1.0e-9, bench_n: 600000000, modes: {param: mode, values: [none, lock, local]}}
  # services: {api: dpc-api}

# Joint scenario (web -> dpc -> web): filled in at stage 13. Template placeholder, not used yet.
scenario: []
