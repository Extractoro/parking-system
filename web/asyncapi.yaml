# AsyncAPI 3.0 description of the events of C09 «Паркінги» (Web part, labs 4-5), from asyncapi.example.yaml.
# Events are CloudEvents 1.0 in the structured mode (D4.1). Check: npx @asyncapi/cli validate web/asyncapi.yaml
asyncapi: 3.0.0
info:
  title: C09 Паркінги - події Web
  version: 1.0.0
  description: |
    Події пише лише таблиця вихідних подій (`outbox`) у транзакції, що змінює предметний стан;
    публікатор надсилає збережений конверт без змін, тож повторна публікація зберігає `id`.
    Сутність усіх подій `domain-events` - бронювання: ключ повідомлення й `subject` - id бронювання, тому події
    одного бронювання читаються по порядку з однієї партиції.
    Тема `notifications` (ЛР5): ключ і `subject` - id користувача; її читають обидва шлюзи, кожен своєю
    групою, і надсилають сповіщення своїм WebSocket-з'єднанням цього користувача (канал `/v1/ws`).
defaultContentType: application/cloudevents+json

servers:
  local:
    host: localhost:9094
    protocol: kafka
    description: Kafka з compose.yaml (усередині мережі Compose - broker:9092)
  gateways:
    host: localhost:8080
    pathname: /v1/ws
    protocol: ws
    description: nginx -> gateway-a / gateway-b (напряму - :8091, :8092); квиток у ?ticket=, Origin = CLIENT_ORIGIN

channels:
  domainEvents:
    address: domain-events
    description: Зафіксовані зміни предметного стану Web (3 партиції)
    servers:
      - $ref: "#/servers/local"
    messages:
      bookingCreated:
        $ref: "#/components/messages/BookingCreated"
      entryRequested:
        $ref: "#/components/messages/EntryRequested"
      entryOpened:
        $ref: "#/components/messages/EntryOpened"
  notifications:
    address: notifications
    description: Сповіщення користувачів і відкликання сесій (3 партиції, ключ - id користувача)
    servers:
      - $ref: "#/servers/local"
    messages:
      notificationCreated:
        $ref: "#/components/messages/NotificationCreated"
      sessionRevoked:
        $ref: "#/components/messages/SessionRevoked"
  clientSocket:
    address: /v1/ws
    description: |
      З'єднання клієнта зі шлюзом. Перший кадр - hello з назвою шлюзу, далі по кадру на сповіщення.
      Клієнт нічого не надсилає; пропущене дочитує з GET /v1/me/notifications?after=.
    servers:
      - $ref: "#/servers/gateways"
    messages:
      hello:
        $ref: "#/components/messages/Hello"
      notification:
        $ref: "#/components/messages/NotificationFrame"

operations:
  publishDomainEvents:
    action: send
    channel:
      $ref: "#/channels/domainEvents"
    summary: Публікатор (сервіс publisher) надсилає порції з outbox, acks=all, позначає опублікованими після підтвердження
  handleEntryRequested:
    action: receive
    channel:
      $ref: "#/channels/domainEvents"
    messages:
      - $ref: "#/channels/domainEvents/messages/entryRequested"
    summary: Обробник (група worker) викликає симулятор шлагбаума з ключем = id операції й фіксує результат
  relayEntryOpened:
    action: receive
    channel:
      $ref: "#/channels/domainEvents"
    messages:
      - $ref: "#/channels/domainEvents/messages/entryOpened"
    summary: Relay (група relay) передає відкриття в DPC як POST /v1/entries з event_id = id операції
  publishNotifications:
    action: send
    channel:
      $ref: "#/channels/notifications"
    summary: Публікатор надсилає notification.created (записане add_notification у транзакції причини) і session.revoked (транзакція виходу)
  gatewayReadsNotifications:
    action: receive
    channel:
      $ref: "#/channels/notifications"
    summary: Кожен шлюз читає тему своєю групою (gateway-a, gateway-b), тож отримує кожне повідомлення; session.revoked не пересилає, а закриває з'єднання сесії кодом 1008
  gatewaySendsToClient:
    action: send
    channel:
      $ref: "#/channels/clientSocket"
    summary: Шлюз надсилає сповіщення лише своїм з'єднанням його користувача

components:
  messages:
    BookingCreated:
      name: booking.created
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      payload:
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            properties:
              type:
                const: booking.created
              data:
                type: object
                required: [entity_id, entity_version, user_id, level_id, from_hour, hours]
                properties:
                  entity_id:
                    type: string
                    description: id бронювання
                  entity_version:
                    type: integer
                  user_id:
                    type: string
                  level_id:
                    type: string
                  from_hour:
                    type: string
                    format: date-time
                  hours:
                    type: integer
      examples:
        - payload:
            specversion: "1.0"
            id: f3f2a931-5872-4b78-95aa-1d97f68d4710
            source: parking-web
            type: booking.created
            subject: 5810351a-3a56-4269-8ce7-e233a3728bb5
            time: "2026-11-11T09:57:39.745Z"
            datacontenttype: application/json
            data:
              entity_id: 5810351a-3a56-4269-8ce7-e233a3728bb5
              entity_version: 1
              user_id: user1
              level_id: center-1
              from_hour: "2026-11-11T09:00:00.000Z"
              hours: 2
    EntryRequested:
      name: entry.requested
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      payload:
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            properties:
              type:
                const: entry.requested
              data:
                type: object
                required: [entity_id, entity_version, operation_id, user_id, garage_id, plate]
                properties:
                  entity_id:
                    type: string
                    description: id бронювання
                  entity_version:
                    type: integer
                  operation_id:
                    type: string
                    description: id операції - ключ ідемпотентності симулятора
                  user_id:
                    type: string
                  garage_id:
                    type: string
                  plate:
                    type: string
    EntryOpened:
      name: entry.opened
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      payload:
        allOf:
          - $ref: "#/components/schemas/CloudEvent"
          - type: object
            properties:
              type:
                const: entry.opened
              data:
                type: object
                required: [entity_id, entity_version, operation_id, user_id, garage_id, plate, opened_at, effect_id]
                properties:
                  entity_id:
                    type: string
                    description: id бронювання (booking_id для DPC)
                  entity_version:
                    type: integer
                  operation_id:
                    type: string
                    description: event_id запиту в DPC
                  user_id:
                    type: string
                  garage_id:
                    type: string
                  plate:
                    type: string
                  opened_at:
                    type: string
                    format: date-time
                    description: UTC з мілісекундами й Z (event_time запиту в DPC)
                  effect_id:
                    type: string

    NotificationCreated:
      name: notification.created
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      payload:
        allOf:
          - $ref: "#/components/schemas/UserEnvelope"
          - type: object
            properties:
              type:
                const: notification.created
              data:
                allOf:
                  - $ref: "#/components/schemas/Notification"
                  - type: object
                    required: [user_id]
                    properties:
                      user_id:
                        type: string
    SessionRevoked:
      name: session.revoked
      headers:
        $ref: "#/components/schemas/KafkaHeaders"
      payload:
        allOf:
          - $ref: "#/components/schemas/UserEnvelope"
          - type: object
            properties:
              type:
                const: session.revoked
              data:
                type: object
                required: [user_id, session_token_hash]
                properties:
                  user_id:
                    type: string
                  session_token_hash:
                    type: string
                    description: sha256 токена сесії (hex), як у таблицях session і ws_ticket
    Hello:
      name: hello
      contentType: application/json
      payload:
        type: object
        required: [type, gateway]
        properties:
          type:
            const: hello
          gateway:
            type: string
            description: gateway-a або gateway-b
    NotificationFrame:
      name: notification
      contentType: application/json
      payload:
        $ref: "#/components/schemas/Notification"

  schemas:
    Notification:
      type: object
      required: [id, position, type, text, created_at]
      properties:
        id:
          type: string
        position:
          type: integer
          minimum: 1
          description: Позиція в стрічці користувача, та сама, що в GET /v1/me/notifications
        type:
          type: string
          enum: [booking.confirmed, booking.ending, entry.opened, entry.failed]
        text:
          type: string
        created_at:
          type: string
          format: date-time
    UserEnvelope:
      type: object
      description: Конверт CloudEvents 1.0 повідомлень теми notifications (data - саме повідомлення, без entity_version)
      required: [specversion, id, source, type, subject, time, datacontenttype, data]
      properties:
        specversion:
          const: "1.0"
        id:
          type: string
        source:
          const: parking-web
        type:
          type: string
        subject:
          type: string
          description: id користувача (він же ключ повідомлення Kafka)
        time:
          type: string
          format: date-time
        datacontenttype:
          const: application/json
        data:
          type: object
    CloudEvent:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, data]
      properties:
        specversion:
          const: "1.0"
        id:
          type: string
          description: Стабільний ідентифікатор події (uuid). Повтор публікації зберігає його
        source:
          const: parking-web
        type:
          type: string
        subject:
          type: string
          description: id бронювання (він же ключ повідомлення Kafka)
        time:
          type: string
          format: date-time
        datacontenttype:
          const: application/json
        data:
          type: object
          required: [entity_id, entity_version]
    KafkaHeaders:
      type: object
      properties:
        content-type:
          const: application/cloudevents+json
        ce_type:
          type: string
        ce_id:
          type: string
