<!doctype html>
<!--
  O3.3 of C09 «Паркінги»: a page of ANOTHER site that calls the Web API (nginx :8080).
  Serve it on another origin than the client (from the project root):
    python -m http.server 8082 --bind 127.0.0.1 --directory web/tools/evil-origin
  and open http://localhost:8082 (the client itself runs on http://localhost:5173 = CLIENT_ORIGIN).

  The login of this project is an opaque token in `Authorization: Bearer`, kept by the client in
  sessionStorage of ITS origin. This page cannot read it, and the browser never adds it to a request by
  itself (it is not a cookie), so every request below goes without the user's identity:
  1. "Create a booking" - fetch POST /v1/bookings with JSON and Idempotency-Key: needs a preflight
     (OPTIONS); the server gives no Access-Control-Allow-Origin to this origin, so the browser does not
     send the POST at all.
  2. "Read the catalog" - a simple GET /v1/garages (no preflight): the request reaches the server and
     gets 200, but without Access-Control-Allow-Origin the browser does not let this page read it.
  3. "HTML form" - a classic form POST (text/plain, no preflight): the browser sends it, but with no
     token, so the server answers 401 before any action.
  The same file opened on the allowed origin shows "answer read" for 1 and 2 (the screenshots of the
  report do this to compare both cases). Check in the database that nothing changed.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Another site (CORS check)</title>
    <style>
        body {
            font: 15px/1.5 system-ui, sans-serif;
            max-width: 46rem;
            margin: 1.5rem auto;
            padding: 0 1rem;
            color: #1d232a;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 .25rem;
        }

        .origin {
            font-family: ui-monospace, monospace;
            background: #fff4d6;
            padding: .1rem .4rem;
            border-radius: 4px;
        }

        label {
            display: block;
            margin-top: .75rem;
        }

        input, textarea {
            width: 100%;
            font: inherit;
            box-sizing: border-box;
        }

        textarea {
            height: 4.5rem;
            font-family: ui-monospace, monospace;
            font-size: 13px;
        }

        button {
            margin: 1rem .5rem 0 0;
            font: inherit;
            padding: .35rem .8rem;
        }

        #results {
            list-style: none;
            padding: 0;
            margin: 1rem 0 0;
        }

        #results li {
            border-left: 4px solid #999;
            background: #f5f6f7;
            padding: .5rem .75rem;
            margin-bottom: .5rem;
            font-size: 14px;
        }

        #results li.blocked {
            border-color: #c0392b;
            background: #fdecea;
        }

        #results li.read {
            border-color: #1e8449;
            background: #e9f7ef;
        }

        #results li.sent {
            border-color: #b9770e;
            background: #fef5e7;
        }

        .verdict {
            font-weight: 700;
        }

        code, .mono {
            font-family: ui-monospace, monospace;
            font-size: 13px;
        }

        iframe {
            width: 100%;
            height: 5rem;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Another site</h1>
    <p>This page runs on <span class="origin" id="origin"></span> and calls the parking API directly.</p>

    <label>API <input id="api" value="http://localhost:8080"></label>
    <label>Booking body (POST /v1/bookings)
        <textarea id="body">{"level_id": "mall-1", "from_hour": "2030-06-01T10:00:00+03:00", "hours": 1, "plate": "EV1234IL"}</textarea>
    </label>
    <button id="post">1. Create a booking (fetch)</button>
    <button id="get">2. Read the catalog (fetch)</button>
    <button id="form">3. HTML form POST</button>

    <ul id="results" aria-live="polite"></ul>

    <form id="evil" method="post" enctype="text/plain" target="sink" hidden>
        <input id="evil-field">
    </form>
    <iframe name="sink" title="answer of the form" hidden></iframe>

    <script>
        const $ = (id) => document.getElementById(id);
        $("origin").textContent = location.origin;

        function show(kind, verdict, detail) {
            const li = document.createElement("li");
            li.className = kind;
            li.innerHTML = `<span class="verdict"></span><br><span class="detail"></span>`;
            li.querySelector(".verdict").textContent = verdict;
            li.querySelector(".detail").textContent = detail;
            $("results").prepend(li);
        }

        async function attempt(label, path, init) {
            try {
                const reply = await fetch($("api").value + path, init);
                const text = await reply.text();
                show("read", `${label}: answer read by this page`,
                    `HTTP ${reply.status}; Access-Control-Allow-Origin = ${location.origin}; ${text.slice(0, 120)}`);
            } catch (error) {
                show("blocked", `${label}: blocked by the browser (CORS)`,
                    `${error.name}: ${error.message}. The server sent no Access-Control-Allow-Origin for ${location.origin}.`);
            }
        }

        $("post").onclick = () => attempt("POST /v1/bookings", "/v1/bookings", {
            method: "POST",
            headers: {"Content-Type": "application/json", "Idempotency-Key": crypto.randomUUID()},
            body: $("body").value,
        });

        $("get").onclick = () => attempt("GET /v1/garages", "/v1/garages", {});

        $("form").onclick = () => {
            // text/plain sends "name=value" as is: {"a": 1, "pad": "=" + "} keeps the body valid JSON
            const form = $("evil");
            const body = $("body").value.trim();
            form.action = $("api").value + "/v1/bookings";
            $("evil-field").name = body.slice(0, -1) + ', "pad": "';
            $("evil-field").value = '"}';
            form.submit();
            show("sent", "HTML form POST /v1/bookings: sent without a token",
                "A form carries no Authorization header, and the login is not a cookie: the server answers 401 before any action.");
        };
    </script>
</body>
</html>
